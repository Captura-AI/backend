services:
  app:
    build:
      context: .
      target: builder
    container_name: nestjs_app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-1337}:1337'
    environment:
      APP_NAME: ${APP_NAME:-NestJS Starter Kit}
      APP_HOST: 0.0.0.0
      APP_PORT: 1337
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME:-nestjs_starter_kit}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_PORT: 5432
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
      DATABASE_LOGGING: ${DATABASE_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_ISSUER: ${JWT_ISSUER:-nestjs-starter-kit}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev
    networks:
      - app_network

  postgres:
    # pgvector image is required: migrations run `CREATE EXTENSION vector`
    # (alongside pg_trgm and fuzzystrmatch) for hybrid + fuzzy plate search.
    image: pgvector/pgvector:pg16
    container_name: nestjs_postgres
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-captura_ai}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-captura_ai}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7.4-alpine
    container_name: nestjs_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # S3-compatible object storage for local development (mirrors the NAS/MinIO
  # tier in ARCHITECTURE.md). NOTE: the backend currently writes uploads to
  # local disk — wiring the S3 client is Phase 16. MinIO is provided here so
  # the dev runtime is storage-ready ahead of that work.
  minio:
    image: minio/minio:latest
    container_name: captura_minio
    restart: unless-stopped
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  # One-shot job: waits for MinIO, then creates the buckets the platform uses.
  minio-createbuckets:
    image: minio/mc:latest
    container_name: captura_minio_createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      /usr/bin/mc mb -p local/captura-originals;
      /usr/bin/mc mb -p local/captura-derivatives;
      /usr/bin/mc mb -p local/captura-private;
      /usr/bin/mc anonymous set download local/captura-originals;
      /usr/bin/mc anonymous set download local/captura-derivatives;
      exit 0;
      "
    networks:
      - app_network

volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge
